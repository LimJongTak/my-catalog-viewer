<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>MushEat</title>
     
    <link rel="icon" href="jjpyogo.ico">

    <meta name="description" content="정남진장흥표고(주)의 식물성 비건햄 '머쉬잇'을 만나보세요.">
    <meta name="keywords" content="정남진장흥표고, 표고버섯, 장흥표고, 버섯요리, 선물세트, MushEat, 머쉬잇">
    <meta name="author" content="MushEat">

    <meta property="og:type" content="website">
    <meta property="og:title" content="MushEat">
    <meta property="og:description" content="최고 품질의 표고버섯으로 만든 MushEat을 확인해보세요. (다국어 지원)">
    
    <meta property="og:image" content="thumbnail.png">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MushEat">
    <meta name="twitter:description" content="최고 품질의 표고버섯으로 만든 MushEat을 카탈로그로 확인해보세요.">
    <meta name="twitter:image" content="thumbnail.png">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div id="lang-select">
        <img src="logo.png" id="header-logo" alt="Logo">

        <button id="lang-toggle">
            Language
        </button>
        
        <div id="lang-options">
            <button data-lang="ko" class="active">한국어</button>
            <button data-lang="en">English</button>
            <button data-lang="zh">中文</button>
            <button data-lang="vi">Tiếng Việt</button>
        </div>
    </div>

    <div id="loader" class="visible">
        Getting catalog...
    </div>

    <div id="catalog-container">
        
        <div id="slider-container">
            
            <button id="prev-btn" class="slider-nav-btn" aria-label="이전 페이지">
                &#10094; </button>

            <div id="horizontal-scroll-wrapper"></div>

            <button id="next-btn" class="slider-nav-btn" aria-label="다음 페이지">
                &#10095; </button>

        </div>
    </div>

    <script src="app.js" defer></script>

</body>
</html>
